name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Create .env file
        run: |
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "APP_URL=${{ secrets.APP_URL }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Copy files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: ".,!node_modules,!.git"
          target: ${{ secrets.SERVER_PATH }}

      - name: Execute SSH Commands on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            if [ ! -d "$NVM_DIR" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            fi
            
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            if ! command -v node &> /dev/null; then
              nvm install 22
              nvm alias default 22
              nvm use 22
            fi
            
            cd ${{ secrets.SERVER_PATH }}

            cat > .env <<'EOF'
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            NODE_ENV=production
            EOF

            export DATABASE_HOST="${{ secrets.DATABASE_HOST }}"
            export DATABASE_NAME="${{ secrets.DATABASE_NAME }}"
            export DATABASE_PASSWORD="${{ secrets.DATABASE_PASSWORD }}"
            export DATABASE_PORT="${{ secrets.DATABASE_PORT }}"
            export DATABASE_USER="${{ secrets.DATABASE_USER }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export APP_URL="${{ secrets.APP_URL }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}"
            
            NODE_ENV=development npm install --include=dev --legacy-peer-deps
            NODE_ENV=development npm run db:push
            npm prune --omit=dev --legacy-peer-deps
            export NODE_ENV=production
            
            if ! command -v pm2 &> /dev/null; then
                npm install -g pm2
            fi
            
            pm2 startOrRestart ecosystem.config.cjs --update-env

            if command -v systemctl &> /dev/null; then
              if command -v sudo &> /dev/null && sudo -n true 2>/dev/null; then
                sudo env PATH=$PATH pm2 startup systemd -u "$(whoami)" --hp "$HOME" || true
              else
                pm2 startup systemd -u "$(whoami)" --hp "$HOME" || true
              fi
            fi

            pm2 save

            # PM2 ve Node path'lerini bulup crontab @reboot olarak ekleyelim (sudo gerektirmeden otomatik baslatma icin)
            PM2_BIN=$(which pm2 2>/dev/null || echo "$HOME/.nvm/versions/node/v22.13.1/bin/pm2")
            NODE_BIN_DIR=$(dirname $(which node 2>/dev/null || echo "$HOME/.nvm/versions/node/v22.13.1/bin/node"))
            (crontab -l 2>/dev/null | grep -F "pm2 resurrect" || (crontab -l 2>/dev/null; echo "@reboot env PATH=\"$NODE_BIN_DIR:\$PATH\" $PM2_BIN resurrect")) | crontab -

            for attempt in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:${PORT:-3000}/api/health"; then
                echo "API health check passed"
                break
              fi

              if [ "$attempt" = "5" ]; then
                echo "API health check failed after PM2 restart"
                pm2 status
                pm2 logs kerimbilgisayar --lines 100 --nostream
                exit 1
              fi

              echo "API health check failed, retrying..."
              sleep 3
            done
            
            echo "--- PM2 STATUS ---"
            pm2 status
            echo "--- PM2 LOGS ---"
            pm2 logs kerimbilgisayar --lines 50 --nostream
